    <div align="center"><b>Basic Definitions</b><br>
    </div>
    <hr size="2" width="100%"><b>Adenocarcinoma</b><br>
    A malignant tumour formed from glandular structures in epithelial
    tissue.<br>
    <br>
    <b>Carcinoma</b><br>
    A cancer arising in the epithelial tissue of the skin or of the
    lining of the internal organs.<br>
    <br>
    <b>Polyp</b><br>
    A small growth protruding from a mucous membrane<br>
    <br>
