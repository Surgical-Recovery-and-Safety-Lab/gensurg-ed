<hr style="width: 100%; height: 2px;"><span style="font-style: italic;">Action</span><br>
Ca++ channel blocker<br>
Slows AV conduction<br>
Coronary artery and peripheral vasodilator<br>
- less significant coronary effect than nifedipine<br>
<span style="font-style: italic;">Uses</span><br>
SVT, AF<br>
<span style="font-style: italic;">Adverse</span><br>
Hypotension, failure<br>
Avoid in conjunction with B-blockers<br>
Increases serum dig levels<br>
Avoid in WPW syndrome<br>
